[install]
exact = true

[test]
coverageSkipTestFiles = true

# ============================================================================
# Bun Configuration (Canonical + Perfectionist Linter & Native Formatter)
# Docs: https://bun.sh/docs/lint | https://bun.sh/docs/format
# ============================================================================

# ============================================================================
# FORMATTER ([fmt]) - Estándar Canonical Prettier + Ordenamiento Nativo
# ============================================================================
[fmt]
# Opciones base de Prettier adoptadas por Canonical
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
quoteProps = "as-needed"
jsxSingleQuote = false
trailingComma = "all"
bracketSpacing = true
bracketSameLine = false
arrowParens = "always"
endOfLine = "lf"

# Superpoderes nativos en Rust de bun fmt
# Nota: Desactivamos sortImports en [fmt] para que no colisione con las reglas granulares de Perfectionist en [lint]
sortImports = false
sortPackageJson = true
sortTailwindcss = true
jsdoc = true

# Ignorar artefactos y archivos autogenerados al formatear
ignorePatterns = [
  "dist/",
  "build/",
  "coverage/",
  "node_modules/",
  "**/*.gen.ts",
  "**/*.d.ts",
  "bun.lock",
  "package-lock.json",
  "pnpm-lock.yaml"
]

# Overrides de formato para archivos específicos
[[fmt.overrides]]
files = ["*.test.ts", "*.spec.ts", "*.e2e-spec.ts"]
options = { printWidth = 120 }

[[fmt.overrides]]
files = ["*.md", "*.json", "*.yaml", "*.yml"]
options = { tabWidth = 2, singleQuote = false }

# ============================================================================
# LINTER ([lint]) - Canonical + Perfectionist Architecture
# ============================================================================
[lint]
# Activa el chequeo de tipos nativo de Bun (necesario para las reglas de canonical/typescript-type-checking)
typeAware = true
typeCheck = true

# Plugins externos de ESLint (Perfectionist corre sobre el motor híbrido de Bun; unicorn, import y ts son nativos)
plugins = ["eslint-plugin-perfectionist"]

# Ignorar directorios de artefactos, compilación y cobertura
ignorePatterns = [
  "dist/",
  "build/",
  "coverage/",
  "node_modules/",
  "**/*.gen.ts",
  "**/*.d.ts"
]

# ============================================================================
# Categorías Base (Nivel de exigencia: Máximo / Canonical)
# ============================================================================
[lint.categories]
correctness = "error"
suspicious = "error"
pedantic = "error"
perf = "error"
style = "error"
restriction = "error"

# ============================================================================
# Configuración Global de Perfectionist
# Docs: https://perfectionist.dev/guide/getting-started#settings
# ============================================================================
[lint.settings.perfectionist]
type = "natural"
order = "asc"
ignoreCase = false
specialCharacters = "keep"
partitionByComment = true
partitionByNewLine = false

# ============================================================================
# Reglas de Perfectionist (Orden determinista absoluto)
# ============================================================================
[lint.rules]
"perfectionist/sort-array-includes" = "error"
"perfectionist/sort-classes" = "error"
"perfectionist/sort-decorators" = "error"
"perfectionist/sort-enums" = "error"
"perfectionist/sort-export-attributes" = "error"
"perfectionist/sort-exports" = "error"
"perfectionist/sort-heritage-clauses" = "error"
"perfectionist/sort-import-attributes" = "error"
"perfectionist/sort-imports" = [
  "error",
  {
    type = "natural",
    order = "asc",
    newlinesBetween = "always",
    internalPattern = ["^@/.*"]
  }
]
"perfectionist/sort-interfaces" = "error"
"perfectionist/sort-intersection-types" = "error"
"perfectionist/sort-jsx-props" = "error"
"perfectionist/sort-maps" = "error"
"perfectionist/sort-modules" = "error"
"perfectionist/sort-named-exports" = "error"
"perfectionist/sort-named-imports" = "error"
"perfectionist/sort-object-types" = "error"
"perfectionist/sort-objects" = "error"
"perfectionist/sort-sets" = "error"
"perfectionist/sort-switch-case" = "error"
"perfectionist/sort-union-types" = "error"
"perfectionist/sort-variable-declarations" = "error"

# Desactivar reglas nativas de ordenamiento que colisionan con Perfectionist
"sort-imports" = "off"
"sort-keys" = "off"
"sort-vars" = "off"
"import/order" = "off"

# ============================================================================
# Reglas de Canonical: Core ESLint (Cero ambigüedad y mutación controlada)
# ============================================================================
"array-callback-return" = ["error", { allowImplicit = false, checkForEach = true }]
"block-scoped-var" = "error"
"complexity" = ["error", 15]
"consistent-return" = "error"
"curly" = ["error", "all"]
"default-case" = "error"
"default-case-last" = "error"
"default-param-last" = "error"
"eqeqeq" = ["error", "always"]
"for-direction" = "error"
"func-name-matching" = "error"
"func-names" = ["error", "never"]
"grouped-accessor-pairs" = ["error", "getBeforeSet"]
"guard-for-in" = "error"
"no-alert" = "error"
"no-await-in-loop" = "error"
"no-bitwise" = "error"
"no-caller" = "error"
"no-console" = "error"
"no-constant-binary-expression" = "error"
"no-constructor-return" = "error"
"no-continue" = "error"
"no-debugger" = "error"
"no-div-regex" = "error"
"no-else-return" = ["error", { allowElseIf = false }]
"no-empty-function" = "error"
"no-eq-null" = "error"
"no-eval" = "error"
"no-extend-native" = "error"
"no-extra-bind" = "error"
"no-extra-label" = "error"
"no-Floating-decimal" = "off" # deprecado en favor de bun fmt
"no-implicit-coercion" = ["error", { boolean = true, number = true, string = true }]
"no-implicit-globals" = "error"
"no-implied-eval" = "error"
"no-inline-comments" = "error"
"no-iterator" = "error"
"no-label-var" = "error"
"no-labels" = "error"
"no-lone-blocks" = "error"
"no-lonely-if" = "error"
"no-loop-func" = "error"
"no-multi-assign" = "error"
"no-multi-str" = "error"
"no-negated-condition" = "error"
"no-nested-ternary" = "error"
"no-new" = "error"
"no-new-func" = "error"
"no-new-wrappers" = "error"
"no-object-constructor" = "error"
"no-octal-escape" = "error"
"no-param-reassign" = ["error", { props = true }]
"no-plusplus" = ["error", { allowForLoopAfterthoughts = true }]
"no-promise-executor-return" = "error"
"no-proto" = "error"
"no-return-assign" = ["error", "always"]
"no-script-url" = "error"
"no-self-compare" = "error"
