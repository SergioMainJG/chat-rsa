name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository; nothing they run gets a token that can write.
permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for the code the job runs afterwards.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint / bun fmt are canary-only for now; move to "latest" once they ship in stable.
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun lint --max-warnings 0
      - run: bun run typecheck
      - run: bun run test:unit

  integration:
    name: Integration and e2e tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://chat:chat@localhost:5432/chat
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for the code the job runs afterwards.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - run: bun run test:e2e
