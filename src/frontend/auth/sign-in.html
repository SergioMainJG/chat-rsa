<!doctype html>
<html lang="en" data-guard="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · chat-rsa</title>
    <!-- Route guard (auth.page-guard.ts): inline so it applies before the first paint in every
         browser, without waiting for a stylesheet. The script removes data-guard to reveal. -->
    <style>
      html[data-guard='pending'] body {
        visibility: hidden;
      }
      @media (scripting: none) {
        html[data-guard='pending'] body {
          visibility: visible;
        }
      }
    </style>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./auth.css" />
    <script type="module" src="./auth.form.ts"></script>
  </head>
  <body>
    <main class="auth">
      <h1>Sign in</h1>
      <form class="auth-form" action="/api/auth/sign-in" method="post" data-auth-form>
        <fieldset>
          <div class="field">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              maxlength="64"
              pattern="[\p{L}\p{N}]+"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              aria-describedby="name-error"
            />
            <p class="field-error" id="name-error" data-error-for="name"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-control">
              <input
                id="password"
                type="password"
                name="password"
                required
                maxlength="256"
                autocomplete="current-password"
                aria-describedby="password-error"
              />
              <button
                type="button"
                class="password-toggle"
                aria-controls="password"
                aria-pressed="false"
                data-password-toggle
              >
                <span class="when-hidden">Show password</span>
                <span class="when-shown">Hide password</span>
              </button>
            </div>
            <p class="field-error" id="password-error" data-error-for="password"></p>
          </div>
          <p class="form-message" role="alert" data-form-message></p>
          <button type="submit">Sign in</button>
        </fieldset>
      </form>
      <p class="switch">Don't have an account? <a href="/sign-up">Create one</a></p>
    </main>
  </body>
</html>
